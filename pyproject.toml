[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "aivp-harness"
version = "2.0.0.dev0"
description = "AIVP v2 Coding-Agent Harness Panel"
requires-python = ">=3.11"

[project.scripts]
aivp = "aivp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
